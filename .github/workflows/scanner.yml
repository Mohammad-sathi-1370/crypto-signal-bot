
name: Crypto Signal Scanner

on:
  schedule:
    - cron: '30-59/5 4 * * *'
    - cron: '*/5 5-17 * * *'
    - cron: '0-25/5 18 * * *'
    - cron: '40 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crypto-signal-bot
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run signal bot
        if: github.event_name == 'workflow_dispatch' || github.event.schedule != '40 18 * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Send daily performance report
        if: github.event.schedule == '40 18 * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py report

      - name: Save signal history
        if: success()
        run: |
          git config user.name "Crypto Signal Bot"
          git config user.email "crypto-bot@users.noreply.github.com"
          git add signals.json
          if ! git diff --cached --quiet; then
            git commit -m "Update signal history"
            git push
          else
            echo "No signal history changes."
          fi
